# tk-3de4 - ShotGrid Toolkit engine voor 3DEqualizer 4 (R8+)
# NFA VFXIM pipeline — Luuk Kamphuis

configuration:
  menu_favourites:
    type: list
    description: "Apps shown at the top of the ShotGrid panel: list of {app_instance, name}."
    allows_empty: True
    default_value: []
    values:
      type: dict
      items:
        name: { type: str }
        app_instance: { type: str }

  pyside_path:
    type: str
    description: >
      Folder with PySide6 for 3DE's Python 3.11. Empty = the local install made on first
      start (%LOCALAPPDATA%\NFA\3de\pyside6\<version>).
    default_value: ""

  tools_path:
    type: str
    description: >
      Folder holding the tk_3de4 tools package (panel, Shot Overview, ...). Loaded from the
      pipeline repo so tool updates don't need an engine release. Falls back to the copy
      bundled with the engine when the folder is missing.
    default_value: "C:/pipeline/3de/python"

  qt_pump_interval:
    type: int
    description: "Interval in ms at which Qt events are processed through tde4.setTimerCallbackFunction."
    default_value: 20

display_name: "3DEqualizer"
description: "ShotGrid integration for 3DEqualizer 4 R8 (NFA VFXIM pipeline)."

requires_shotgun_version:
requires_core_version: "v0.20.0"

frameworks: []
